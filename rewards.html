<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewards</title>
<link rel="stylesheet" href="app.css">
<script src="language-boot.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif}.rewards-page{width:min(960px,calc(100% - 28px));margin:auto;padding-bottom:130px}.hero,.reward-card,.note{background:var(--panel);border:1px solid #293246;border-radius:16px;padding:20px;margin:14px 0}.hero{text-align:center;background:linear-gradient(135deg,#111827,#18233a)}.hero h1{margin:0 0 10px}.hero p,.reward-card p,.note p{color:#cbd5e1;line-height:1.65}.reward-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.reward-card{margin:0}.reward-card h2{margin:0 0 10px;color:var(--accent);font-size:19px}.reward-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}.reward-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--panel-soft);color:#e5e7eb}.reward-title{display:block;font-weight:800}.reward-progress{display:block;margin-top:4px;color:#94a3b8;font-size:13px}.reward-amount{color:var(--success);font-weight:900;white-space:nowrap}.claim-btn{grid-column:1/-1;border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(135deg,#22c55e,#84cc16);color:#04130a;font-size:15px;font-weight:900;cursor:pointer}.claim-btn:disabled{background:#475569;color:#cbd5e1;cursor:not-allowed}.note{border-color:#f59e0b;background:rgba(245,158,11,.08)}.empty{padding:16px;border-radius:12px;background:var(--panel-soft);color:#cbd5e1;text-align:center}
</style>
</head>
<body>
<script>
const API_URL = ["localhost", "127.0.0.1"].includes(location.hostname) ? location.origin : "https://cryptoapp-eqc5.onrender.com";
const token = localStorage.getItem("token") || "";
if (localStorage.getItem("logged_in") !== "1" && !token) location.href = "login.html";
</script>

<main class="rewards-page">
  <section class="hero">
    <h1 id="rewardsTitle">Rewards</h1>
    <p id="rewardsIntro"></p>
  </section>

  <section class="reward-grid">
    <article class="reward-card">
      <h2 id="balanceTitle">Balance</h2>
      <ul id="balanceRewards" class="reward-list"><li class="empty" data-copy="loading">Loading...</li></ul>
    </article>

    <article class="reward-card">
      <h2 id="satelliteTitle">Satellites</h2>
      <p id="satelliteNote"></p>
      <ul id="satelliteRewards" class="reward-list"><li class="empty" data-copy="loading">Loading...</li></ul>
    </article>

    <article class="reward-card">
      <h2 id="tradeTitle">Trading</h2>
      <p id="tradeNote"></p>
      <ul id="tradeRewards" class="reward-list"><li class="empty" data-copy="loading">Loading...</li></ul>
    </article>
  </section>

  <section class="note">
    <h2 id="importantTitle">Important</h2>
    <p id="importantText"></p>
  </section>
</main>

<script>
const money = value => "$" + Number(value || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const numberText = value => Number(value || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const COPY = {
  en: { title:"Rewards", intro:"This page lists platform goals and rewards. The Claim button becomes active only after the condition is completed. Amounts are shown in USD and stay unchanged when you switch languages.", balance:"Balance", satellites:"Satellites", trading:"Trading", important:"Important", loading:"Loading...", none:"No rewards", error:"Rewards could not be loaded", received:"Received", claim:"Claim", unavailable:"Unavailable", granted:"Reward credited", server:"The server is not responding", progress:"Progress", from:"from", days:"days", activeDeposit:"Active deposit", currentBalance:"Current balance", invited:"Invited-user reward after a confirmed deposit of $2,000+", satelliteReward:"Claim 10% of this satellite's current balance", satelliteNote:"An active satellite has a confirmed deposit of at least $250. For every active satellite, the inviter can claim one reward equal to 10% of that satellite's current balance. Each satellite has its own Claim button.", tradingNote:"Trading days are counted from completed trades. A trade settles 10 minutes after it starts, and the next daily opportunity opens at 00:00.", importantText:"There is no limit on the number of deposits. The minimum amount for each deposit request is $250. Withdrawals start from $100, are available once per hour and use earned funds only. The 7.5% withdrawal fee is applied before the administrator reviews the payout. The withdrawal wallet can be any valid crypto wallet. Rewards are internal platform accounting entries." },
  ru: { title:"Награды", intro:"Здесь собраны цели платформы и награды за их выполнение. Кнопка «Получить» становится активной только после выполнения условия. Суммы указаны в долларах и не меняются при переключении языка.", balance:"Баланс", satellites:"Сателлиты", trading:"Торговля", important:"Важно", loading:"Загрузка...", none:"Наград нет", error:"Не удалось загрузить награды", received:"Получено", claim:"Получить", unavailable:"Недоступно", granted:"Награда начислена", server:"Сервер не отвечает", progress:"Прогресс", from:"от", days:"дней", activeDeposit:"Активное пополнение", currentBalance:"Текущий баланс", invited:"Награда приглашённому после подтверждённого пополнения от $2,000", satelliteReward:"Получить 10% от текущего баланса сателлита", satelliteNote:"Активным считается сателлит с подтверждённым пополнением от $250. За каждого активного сателлита пригласивший может получить одной кнопкой 10% от его текущего баланса. Для каждого сателлита действует отдельная кнопка.", tradingNote:"Торговые дни считаются по завершённым сделкам. Сделка завершается через 10 минут после запуска, а следующая ежедневная возможность открывается в 00:00.", importantText:"Количество пополнений не ограничено. Минимальная сумма каждой заявки на пополнение — $250. Вывод доступен от $100 один раз в час и только из заработанных средств. Комиссия за вывод 7.5% удерживается до проверки выплаты администратором. Для вывода можно использовать любой корректный криптокошелёк. Награды являются внутренними учётными начислениями платформы." },
  uk: { title:"Винагороди", intro:"Тут зібрані цілі платформи та винагороди за їх виконання. Кнопка «Отримати» стає активною тільки після виконання умови. Суми вказані в доларах і не змінюються під час перемикання мови.", balance:"Баланс", satellites:"Сателіти", trading:"Торгівля", important:"Важливо", loading:"Завантаження...", none:"Немає винагород", error:"Не вдалося завантажити винагороди", received:"Отримано", claim:"Отримати", unavailable:"Недоступно", granted:"Винагороду нараховано", server:"Сервер не відповідає", progress:"Прогрес", from:"від", days:"днів", activeDeposit:"Активне поповнення", currentBalance:"Поточний баланс", invited:"Винагорода запрошеному після підтвердженого поповнення від $2,000", satelliteReward:"Отримати 10% від поточного балансу сателіта", satelliteNote:"Активним вважається сателіт із підтвердженим поповненням від $250. За кожного активного сателіта запрошувач може однією кнопкою отримати 10% від його поточного балансу. Для кожного сателіта діє окрема кнопка.", tradingNote:"Торгові дні рахуються за завершеними угодами. Угода завершується через 10 хвилин після старту, а наступна щоденна можливість відкривається о 00:00.", importantText:"Кількість поповнень не обмежена. Мінімальна сума кожної заявки на поповнення — $250. Виведення доступне від $100 один раз на годину і лише із зароблених коштів. Комісія за виведення 7.5% утримується до перевірки виплати адміністратором. Для виведення можна використовувати будь-який коректний криптогаманець. Винагороди є внутрішніми обліковими нарахуваннями платформи." },
  es: { title:"Recompensas", intro:"Aquí se muestran los objetivos de la plataforma y las recompensas por cumplirlos. El botón «Obtener» se activa solo cuando se cumple la condición. Las cantidades se muestran en dólares y no cambian al cambiar el idioma.", balance:"Saldo", satellites:"Satélites", trading:"Trading", important:"Importante", loading:"Cargando...", none:"No hay recompensas", error:"No se pudieron cargar las recompensas", received:"Recibido", claim:"Obtener", unavailable:"No disponible", granted:"Recompensa acreditada", server:"El servidor no responde", progress:"Progreso", from:"desde", days:"días", activeDeposit:"Depósito activo", currentBalance:"Saldo actual", invited:"Recompensa para el invitado después de un depósito confirmado de $2,000 o más", satelliteReward:"Obtener el 10% del saldo actual de este satélite", satelliteNote:"Un satélite activo tiene un depósito confirmado de al menos $250. Por cada satélite activo, el invitador puede obtener con un botón el 10% de su saldo actual. Cada satélite tiene su propio botón.", tradingNote:"Los días de trading se cuentan con operaciones completadas. Una operación termina 10 minutos después de iniciarse y la siguiente oportunidad diaria se abre a las 00:00.", importantText:"No hay límite en el número de depósitos. El importe mínimo de cada solicitud de depósito es $250. Los retiros comienzan desde $100, están disponibles una vez por hora y utilizan solo fondos obtenidos. La comisión de retiro del 7.5% se aplica antes de la revisión del administrador. La billetera de retiro puede ser cualquier billetera cripto válida. Las recompensas son registros contables internos de la plataforma." }
};
const lang = () => ["en", "ru", "uk", "es"].includes(localStorage.getItem("app_language")) ? localStorage.getItem("app_language") : "en";
const copy = () => COPY[lang()];
function renderCopy() {
  const t = copy();
  document.getElementById("rewardsTitle").textContent = t.title;
  document.getElementById("rewardsIntro").textContent = t.intro;
  document.getElementById("balanceTitle").textContent = t.balance;
  document.getElementById("satelliteTitle").textContent = t.satellites;
  document.getElementById("tradeTitle").textContent = t.trading;
  document.getElementById("satelliteNote").textContent = t.satelliteNote;
  document.getElementById("tradeNote").textContent = t.tradingNote;
  document.getElementById("importantTitle").textContent = t.important;
  document.getElementById("importantText").textContent = t.importantText;
  document.querySelectorAll("[data-copy]").forEach(el => el.textContent = t[el.dataset.copy]);
}
const groups = {
  balance: document.getElementById("balanceRewards"),
  satellites: document.getElementById("satelliteRewards"),
  trade: document.getElementById("tradeRewards")
};

function progressText(item) {
  const t = copy();
  if (item.group === "balance") return `${t.progress}: ${money(item.progress)} / ${money(item.target)}`;
  if (item.group === "trade") return `${t.progress}: ${numberText(item.progress)} / ${numberText(item.target)} ${t.days}`;
  if (item.type === "reward_invited_satellite") return `${t.progress}: ${money(item.progress)} / ${money(item.target)}`;
  return `${t.activeDeposit}: ${money(item.satelliteDeposit)} · ${t.currentBalance}: ${money(item.satelliteBalance)}`;
}

function buttonText(item) {
  const t = copy();
  if (item.claimed) return t.received;
  if (item.eligible) return t.claim;
  return t.unavailable;
}

function rewardTitle(item) {
  const t = copy();
  if (item.group === "balance") return `${t.balance} ${t.from} ${money(item.threshold)}`;
  if (item.type === "reward_invited_satellite") return t.invited;
  if (item.group === "satellites") return `${t.satelliteReward} #${item.satelliteId}`;
  return `${item.streakDays} ${t.days}`;
}

function renderGroup(group, rewards) {
  const container = groups[group];
  const items = rewards.filter(item => item.group === group);
  if (!items.length) {
    container.innerHTML = `<li class="empty">${copy().none}</li>`;
    return;
  }
  container.innerHTML = items.map(item => `
    <li class="reward-item">
      <span>
        <span class="reward-title">${rewardTitle(item)}</span>
        <span class="reward-progress">${progressText(item)}</span>
      </span>
      <strong class="reward-amount">${money(item.amount)}</strong>
      <button class="claim-btn" ${item.eligible && !item.claimed ? "" : "disabled"} onclick="claimReward('${item.type}')">${buttonText(item)}</button>
    </li>
  `).join("");
}

async function loadRewards() {
  try {
    const response = await fetch(API_URL + "/rewards/status", { headers: { Authorization: token } });
    if (response.status === 401) throw new Error("auth");
    const data = await response.json();
    if (!data.success) throw new Error("load");
    renderGroup("balance", data.rewards);
    renderGroup("satellites", data.rewards);
    renderGroup("trade", data.rewards);
  } catch {
    Object.values(groups).forEach(container => container.innerHTML = `<li class="empty">${copy().error}</li>`);
  }
}

async function claimReward(type) {
  try {
    const response = await fetch(API_URL + "/rewards/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: token },
      body: JSON.stringify({ type })
    });
    const data = await response.json();
    alert(data.success ? copy().granted : (data.message || copy().unavailable));
    await loadRewards();
  } catch {
    alert(copy().server);
  }
}

renderCopy();
loadRewards();
</script>
<script src="app-nav.js"></script>
</body>
</html>
